version: '3.9'

services:
  # ─── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: agrisaarthi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrisaarthi}
      POSTGRES_USER: ${POSTGRES_USER:-agrisaarthi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrisaarthi_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrisaarthi_user} -d ${POSTGRES_DB:-agrisaarthi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── ChromaDB ────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: agrisaarthi_chromadb
    restart: unless-stopped
    environment:
      CHROMA_SERVER_AUTH_CREDENTIALS_PROVIDER: chromadb.auth.token.TokenConfigServerAuthCredentialsProvider
      ALLOW_RESET: "true"
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Backend (Node.js / Express) ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: agrisaarthi_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      BACKEND_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-agrisaarthi_user}:${POSTGRES_PASSWORD:-agrisaarthi_pass}@postgres:5432/${POSTGRES_DB:-agrisaarthi}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_production_min_64_chars_here}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      AI_SERVICE_URL: http://ai-service:8001
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
      WEATHER_USE_MOCK: ${WEATHER_USE_MOCK:-false}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      SOCKET_IO_CORS_ORIGIN: ${SOCKET_IO_CORS_ORIGIN:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── AI Service (FastAPI / LangGraph) ────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: agrisaarthi_ai
    restart: unless-stopped
    environment:
      AI_SERVICE_PORT: 8001
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-2.0-flash}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      WEATHER_USE_MOCK: ${WEATHER_USE_MOCK:-false}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-agrisaarthi_user}:${POSTGRES_PASSWORD:-agrisaarthi_pass}@postgres:5432/${POSTGRES_DB:-agrisaarthi}
    volumes:
      - ./ai-service:/app
      - ./knowledge:/app/knowledge:ro
      - ai_model_cache:/root/.cache/huggingface
    ports:
      - "8001:8001"
    depends_on:
      chromadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ─── Frontend (React / Vite) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: agrisaarthi_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_AI_SERVICE_URL: http://localhost:8001
      VITE_WS_URL: ws://localhost:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # ─── Nginx (Reverse Proxy) ───────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: agrisaarthi_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
      - ai-service

volumes:
  postgres_data:
  chroma_data:
  uploads_data:
  ai_model_cache:

networks:
  default:
    name: agrisaarthi_network
